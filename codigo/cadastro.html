   <section id="sessao1">
      <div id="cabecalho">
         <h1>TRIALS OF DUNE</h1>
         <p>Junte-se à jornada em Arrakis</p>
      </div>

      <div id="cadastro">
         <h1>Criar Conta</h1>

         <div id="inputs">
            <div id="inp1">
               <h4 class="tituloInput">Nome Completo *</h4>
               <input class="input" oninput="verNome()" type="text" id="inp_nome">
               <div class="msgErro" id="div_msgNome"></div>
            </div>

            <div id="inp2">
               <h4 class="tituloInput">Email *</h4>
               <input class="input" oninput="verEmail()" type="text" id="inp_email">
               <div class="msgErro" id="div_msgEmail"></div>
            </div>

            <div id="inp3">
               <h4 class="tituloInput">Senha *</h4>
               <input class="input" oninput="verSenha()" type="text" id="inp_senha">
               <div class="msgErro" id="div_msgSenha"></div>
            </div>
            
            <div id="inp4">
               <h4 class="tituloInput">Confirmar Senha *</h4>
               <input class="input" oninput="verConfSenha()" type="text" id="inp_confSenha">
               <div class="msgErro" id="div_msgConfSenha"></div>
            </div>
         </div>


         <button onclick="registrar()">Registrar</button>

         <p>ou</p>

         <p id="jaTemConta">Já tem uma conta?</p>

         <button onclick="logar()">Fazer Login</button>
      </div>

   </section>

</body>

<script>
   function logar() {
      window.location.href = "login.html";
   }

   let usuario = [{}]

   let nomeCorreto = false;
   let emailCorreto = false;
   let senhaCorreta = false;
   let confSenhaCorreta = false;


   // Verificar Nome
   function verNome() {
      let nome = inp_nome.value;

      if (nome.length > 2) {
         div_msgNome.innerHTML = ``;
         nomeCorreto = true;
      }
      else if (nome.length == 0) {
         div_msgNome.innerHTML = ``;
      }
      else {
         div_msgNome.innerHTML = `O nome deve ter no mínimo 3 caracteres.`;
         nomeCorreto = false;
      }
   }

   // verificar EMAIL
   function verEmail() {
      let email = inp_email.value.toLowerCase();// toLowerCase pq nao existe email com letra maiuscula

      // verificar existencia de Ponto e Arroba
      if (!email.includes('@') || !email.includes('.')) {
         div_msgEmail.innerHTML = `Insira um email válido.`
         emailCorreto = false;
      }
      else {
         // verificar posicao dos caracteres
         let posicaoArroba = email.indexOf('@');
         let posicaoPonto = email.indexOf('.', posicaoArroba);

         if (posicaoArroba < 1 || posicaoPonto < posicaoArroba + 1) {
            div_msgEmail.innerHTML = `Insira um email válido.`
            emailCorreto = false;
         }
         else {
            div_msgEmail.innerHTML = ``;
            emailCorreto = true;
         }
      }

   }

   // Verificar Senha
   function verSenha() {
      let senha = inp_senha.value;

      // Validação do tamanho da Senha
      if (senha.length < 8) {
         div_msgSenha.innerHTML = `A senha deve conter no mínimo 8 caracteres.`;
         senhaCorreta = false;
      }

      // Validação Letra Maiuscula e minuscula
      else if (senha === senha.toUpperCase() || senha === senha.toLowerCase()) {
         div_msgSenha.innerHTML = `A senha deve conter letras maiúsculas e minúsculas.`;
         senhaCorreta = false;
      }

      // Validação Caractere Especial
      else if (
         !senha.includes('@') &&
         !senha.includes('#') &&
         !senha.includes('%') &&
         !senha.includes('!') &&
         !senha.includes('$') &&
         !senha.includes('&') &&
         !senha.includes('?')
      ) {
         div_msgSenha.innerHTML = `A senha deve conter no mínimo 1 caractere especial.`;
         senhaCorreta = false;
      }

      else {
         div_msgSenha.innerHTML = ``
         senhaCorreta = true;
      }
   }

   // Verificar Confirmação de Senha
   function verConfSenha() {
      let senha = inp_senha.value;
      let confSenha = inp_confSenha.value;

      if (senha === confSenha) {
         div_msgConfSenha.innerHTML = ``;
         confSenhaCorreta = true;
      }
      else {
         confSenhaCorreta = false;
         div_msgConfSenha.innerHTML = `As senhas devem ser compatíveis.`;
      }
   }

   function registrar() {
      let nome = inp_nome.value
      if (
         nomeCorreto &&
         emailCorreto &&
         senhaCorreta &&
         confSenhaCorreta
      ) {
         alert(`${nome}, você foi registrado com sucesso.`)
      }
      else {
         alert(`Não foi possivel registra-lo, verifique seus dados.`)
      }
   }
</script>
