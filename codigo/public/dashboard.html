   <div>
      <canvas id="graficoPizza"></canvas>
   </div>



   <script>
      const ctx = document.getElementById('graficoPizza');

      let labelsX = ['harkonnen', 'Atreides'];
      let valores = [50,10];

      new Chart(ctx, {
         type: 'pie',
         valores: {
            labels: labelsX,
            datasets: [{
               label: '# of Votes',
               data: valores,
               borderWidth: 5
            }]
         },
         options: {
            scales: {
               y: {
                  beginAtZero: true
               }
            }
         }
      });
   </script>
