      <div class="cadastro" id="login">
         <h1>Login</h1>

         <div class="inputs" id="inputs">
            <h4 class="tituloInput">Email *</h4>
            <input class="input" type="text" id="inp_email">

            <h4 class="tituloInput">Senha *</h4>
            <input class="input" type="text" id="inp_senha"><br><br>

         </div>

         <button onclick="entrar()">Entrar</button>

         <p id="aindaNaoTemConta">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>

      </div>
   </section>

<script>
   function entrar() {
      let email = inp_email.value;
      let senha = inp_senha.value;

      if (email == '' || senha == '') {
         alert('Campo(s) Vazio(s)')
      }

      console.log("FORM LOGIN: ", email);
      console.log("FORM SENHA: ", senha);

      fetch("/usuarios/autenticar", {
         method: "POST",
         headers: {
            "Content-Type": "application/json"
         },
         body: JSON.stringify({
            emailServer: email,
            senhaServer: senha
         })
      })

         .then(function (resposta) {
         console.log("Estou no THEN do entrar()!")

         if (resposta.ok) {
            console.log(resposta);
            
            resposta.json().then(json => {
               console.log(json);
               console.log(JSON.stringify(json));
               sessionStorage.EMAIL_USUARIO = json.email;
               sessionStorage.NOME_USUARIO = json.nome;
               sessionStorage.ID_USUARIO = json.id;
               localStorage.setItem("logado", "true");
               
               console.log("login efetuado com sucesso!")
               setTimeout(function () {
                  window.location.href = "dashboard.html";
               }, 1000);

            });

         } else {

            console.log("Houve um erro ao tentar realizar o login!");
         }

      })
         .catch(function (erro) {

            console.log("ERRO:");
            console.log(erro);

         })


   }


   // localStorage.setItem("logado", "true");

   // localStorage.removeItem("logado");



</script>
