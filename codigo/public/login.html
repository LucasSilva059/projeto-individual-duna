   <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
   <header class="header"><!-- header -->

      <nav class="navbar"><!-- navbar -->

         <ul class="itensEsquerda">
            <li>
               <a href="filmes.html">FILMES</a>
            </li>
            <li>
               <a href="livros.html">LIVROS</a>
            </li>
            <li>
               <a href="testePersonalidade.html">TESTE DE PERSONALIDADE</a>
            </li>
         </ul>

         <li class="logo">
            <a href="index.html">
               <img style="width: 95px;" src="assets/imgs/logo 2.png" alt="Logo TOD">
            </a>
         </li>

         <ul class="itensDireita">
            <li>
               <a href="index.html">HOME</a>
            </li>
            <li id="a_login">
               <a href="login.html">LOGIN</a>
            </li>
            <li id="a_dashboard" style="display: none;">
               <a href="dashboard.html">DASHBOARD</a>
            </li>
            <li id="a_sair" style="display: none;">
               <a onclick="sair()">SAIR</a>
            </li>
         </ul>

         <script>
            if (sessionStorage.getItem("login")) {
               document.getElementById("a_dashboard").style.display = "block";
               document.getElementById("a_sair").style.display = "block";
               document.getElementById("a_login").style.display = "none";
            }

            function sair() {
               document.getElementById("a_dashboard").style.display = "none";
               document.getElementById("a_sair").style.display = "none";
               document.getElementById("a_login").style.display = "block";
               sessionStorage.removeItem("login")
            }  
         </script>

      </nav>
   </header>

   <section id="sessao1">
      <div class="cabecalho" id="cabecalho">
         <h1>TRIALS OF DUNE</h1>
         <p>Entre no universo de Arrakis</p>
      </div>

      <div class="cadastro" id="login">
         <h1>Login</h1>

         <div class="inputs" id="inputs">
            <h4 class="tituloInput">Email *</h4>
            <input class="input" type="text" id="inp_email">

            <h4 class="tituloInput">Senha *</h4>
            <input class="input" type="text" id="inp_senha"><br><br>

         </div>

         <button onclick="entrar()">Entrar</button>

         <p id="aindaNaoTemConta">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>

      </div>
   </section>

   <footer class="footer">
      <p>© 2026 TrialsOfDune.</p>
   </footer>

</body>

<script>
   function entrar() {
      let email = inp_email.value;
      let senha = inp_senha.value;

      if (email == '' || senha == '') {
         alert('Campo(s) Vazio(s)')
      }

      console.log("FORM LOGIN: ", email);
      console.log("FORM SENHA: ", senha);

      fetch("/usuarios/autenticar", {
         method: "POST",
         headers: {
            "Content-Type": "application/json"
         },
         body: JSON.stringify({
            emailServer: email,
            senhaServer: senha
         })
      })
         .then(function (resposta) {
            console.log("Estou no THEN do entrar()!")

            if (resposta.ok) {
               console.log(resposta);

               resposta.json().then(json => {
                  console.log(json);
                  console.log(JSON.stringify(json));
                  sessionStorage.EMAIL_USUARIO = json.email;
                  sessionStorage.NOME_USUARIO = json.nome;
                  sessionStorage.ID_USUARIO = json.id;
                  sessionStorage.setItem("login", "true")

                  console.log("login efetuado com sucesso!")
                  setTimeout(function () {
                     window.location.href = "dashboard.html";
                  }, 1000);

               });

            } else {

               console.log("Houve um erro ao tentar realizar o login!");
            }

         })
         .catch(function (erro) {

            console.log("ERRO:");
            console.log(erro);

         })
   }


   // localStorage.setItem("logado", "true");

   // localStorage.removeItem("logado");



</script>
